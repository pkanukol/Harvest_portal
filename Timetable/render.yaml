services:
  # ── Backend API (FastAPI) ─────────────────────────────────────
  - type: web
    name: harvest-timetable-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # set in the Render dashboard - same Supabase Postgres project as AuditApp
      - key: SECRET_KEY
        generateValue: true

  # ── Frontend (React / Vite static site) ──────────────────────
  - type: web
    name: harvest-timetable-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://harvest-timetable.onrender.com   # must match the actual deployed backend service URL
      - key: VITE_PORTAL_URL
        value: https://his-academy360.netlify.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # index.html carries the baked-in VITE_API_URL/VITE_PORTAL_URL and must
      # always be revalidated - otherwise browsers/CDNs cache the app shell
      # from an older build and every deploy after the first appears to do
      # nothing until the visitor hard-refreshes.
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

  # ── Frontend v2 (Supabase-direct, no backend) ────────────────────────
  # The rewrite. Talks straight to Supabase Project B (ukpythuclqvjwygqrsds)
  # for both the tt_ timetable tables and the shared staff_roles / subjects
  # masters - there is no API service behind it, which is the whole point:
  # the Render free-tier cold start on harvest-timetable-api is what this
  # replaces.
  #
  # harvest-timetable-api and harvest-timetable-ui above stay live and
  # untouched until this is proven.
  - type: web
    name: harvest-timetable-v2
    runtime: static
    rootDir: frontend-v2
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Both set in the Render dashboard - VITE_ vars are baked into the
      # bundle at BUILD time, so they must exist before the build runs, and a
      # change to either needs a redeploy to take effect.
      # Use Project B's URL and publishable key - the same pair Attendance uses.
      - key: VITE_TIMETABLE_SUPABASE_URL
        sync: false
      - key: VITE_TIMETABLE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # SPA: every path has to serve index.html or a refresh 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # index.html carries the baked-in Supabase URL/key and must always be
      # revalidated - otherwise browsers/CDNs serve the app shell from an
      # older build and every deploy after the first appears to do nothing
      # until the visitor hard-refreshes.
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

