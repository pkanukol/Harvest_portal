services:
  # ── Backend API (FastAPI) ─────────────────────────────────────
  - type: web
    name: harvest-curriculumtracker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3   # newer Pythons (3.13+) have no prebuilt pydantic-core wheel yet, forcing a Rust/maturin
                        # source build that fails on Render's read-only build filesystem
      - key: DATABASE_URL
        sync: false   # set in the Render dashboard - same Supabase Postgres project as AuditApp/TicketTracker/Timetable
      - key: SECRET_KEY
        generateValue: true
      - key: STAFF_SUPABASE_SERVICE_KEY
        sync: false   # service_role key for the staff_roles project (ukpythuclqvjwygqrsds), set in the Render
                      # dashboard - read-only use, and the only way to read that table since its RLS policies
                      # admit the 'authenticated' role only. Leave unset and the curriculum-lag report still
                      # works, just without class-assignment coverage. The same project holds cct_sessions and
                      # reports, which the CCQ scores on a POW are read from.
      - key: RESEND_API_KEY
        sync: false   # set in the Render dashboard. Declared here so a fresh blueprint deploy does not silently
                      # drop it: with this or RESEND_FROM_EMAIL missing, POW notifications are SIMULATED into the
                      # log and the app reports success, so a lost key looks like silence rather than an error.
      - key: RESEND_FROM_EMAIL
        sync: false   # sender address on the Resend-verified domain, e.g. curriculum@<verified domain>

  # ── Frontend (React / Vite static site) ──────────────────────
  - type: web
    name: harvest-curriculumtracker-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://harvest-curriculumtracker.onrender.com   # update after backend deploys
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # index.html carries the baked-in VITE_API_URL and must
      # always be revalidated - otherwise browsers/CDNs cache the app shell
      # from an older build and every deploy after the first appears to do
      # nothing until the visitor hard-refreshes.
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
