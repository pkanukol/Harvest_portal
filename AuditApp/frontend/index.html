<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Harvest International School — Teachers Audit App</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SSO: exchange Supabase token for AuditApp JWT before React starts
      (function () {
        const ssoToken = new URLSearchParams(location.search).get("sso");
        if (!ssoToken) return;
        // Always re-authenticate on a fresh ?sso= param, even if a token is already
        // cached — a stale/broken cached token would otherwise never get replaced,
        // since this app's localStorage lives on its own origin, separate from the
        // portal's, so signing out at the portal can't clear it.
        // Block React from loading until SSO completes
        document.addEventListener("DOMContentLoaded", function () {}, false);
        // In local dev VITE_API_URL isn't defined, so Vite leaves this placeholder text
        // unreplaced — fall back to a relative path (proxied to the backend by vite.config.js).
        // NOTE: check the first character, not the literal "%VITE_API_URL%" string — once
        // Vite performs its build-time replacement, that literal string IS the real URL, so
        // comparing against it directly would always match (a value always "contains itself"),
        // silently resetting a correctly-injected production URL back to empty.
        var apiBase = "%VITE_API_URL%";
        if (apiBase.charAt(0) === "%") apiBase = "";
        fetch(apiBase + "/api/auth/sso", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ supabase_token: ssoToken }),
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.access_token) {
              localStorage.setItem("token", data.access_token);
              localStorage.setItem("user", JSON.stringify({
                id: data.id, name: data.name, email: data.email,
                role: data.role, designation: data.designation, location: data.location,
              }));
            }
            location.replace(location.pathname);
          })
          .catch(function () {
            location.href = "https://his-academy360.netlify.app";
          });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
